<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
  <style>
    #show-signup-btn {
      margin-top: 20px;
      margin-bottom: 20px;
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main class="login-container">
    
    <form id="signup-form" style="display: none;">
      <h1>New User</h1>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="reg_email" name="reg_email" placeholder="Email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="reg_password" name="reg_password" placeholder="Password" required>
      </div>
      <button type="submit" id="signupBtn">Register</button>
    </form>

    <form id="loginForm" class="login-form">
      <h1>Sign In</h1>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required
               autocomplete="email" aria-describedby="email-error">
        <span id="email-error" class="error" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password">
        <span id="password-error" class="error" aria-live="polite"></span>
      </div>

      <button type="submit" id="loginBtn" disabled>Sign In</button>

      <div id="login-error" class="error-message" role="alert" aria-live="assertive"></div>

      <button id="show-signup-btn">Register</button>
    </form>
  </main>

  <script src="login.js"></script>
</body>
</html>
